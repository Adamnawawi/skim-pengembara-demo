<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Suara Anda, Skim Kita — PERKESO</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@500;700&family=Noto+Sans+Tamil:wght@500;700&display=swap');

  :root{
    --navy:#0B2F5C;
    --navy-dark:#071F3D;
    --green:#1D9E75;
    --green-dark:#167A5B;
    --amber:#EF9F27;
    --red:#D9483A;
    --paper:#FBFAF7;
    --ink:#1C2733;
    --ink-soft:#5B6B7A;
    --line:#E4E1D8;
    --radius:18px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter','Noto Sans SC','Noto Sans Tamil',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.headline{
    font-family:'Montserrat','Noto Sans SC','Noto Sans Tamil','Arial Black',sans-serif;
    font-weight:900;
    line-height:1.15;
    letter-spacing:-0.01em;
    color:var(--navy);
    margin:0;
  }

  #app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;display:flex;flex-direction:column;}

  .demo-flag{
    background:var(--navy-dark);color:#fff;font-size:11px;letter-spacing:.04em;
    text-align:center;padding:6px 10px;font-weight:600;
  }

  .lang-toggle{display:flex;gap:6px;padding:9px 12px;background:var(--navy-dark);justify-content:center;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.08);}
  .lang-btn{
    background:rgba(255,255,255,.08);color:#CFE0F0;border:1px solid rgba(255,255,255,.16);
    border-radius:999px;padding:5px 13px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;
    transition:background .15s, color .15s;
  }
  .lang-btn.active{background:var(--amber);color:var(--navy-dark);border-color:var(--amber);}

  .screen{padding:28px 22px 34px;flex:1;display:flex;flex-direction:column;animation:fadeUp .35s ease both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- HOOK SCREEN ---------- */
  .hook-screen{
    background:linear-gradient(180deg,var(--navy) 0%,var(--navy-dark) 100%);
    color:#fff;min-height:100vh;justify-content:flex-start;
  }
  .hook-eyebrow{color:var(--amber);font-weight:800;letter-spacing:.06em;font-size:13px;text-transform:uppercase;margin-bottom:14px;}
  .hook-headline{font-size:34px;color:#fff;}
  .hook-headline em{font-style:normal;color:var(--amber);}
  .hook-sub{color:#CFE0F0;font-size:16px;margin-top:16px;max-width:36ch;}
  .hook-scene{margin:26px -22px 0;line-height:0;}
  .hook-scene svg{width:100%;height:auto;display:block;}
  .hook-footer{margin-top:auto;padding-top:20px;}

  /* ---------- BRIDGE PROGRESS ---------- */
  .bridge-wrap{margin:0 0 26px;}
  .bridge-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-bottom:8px;font-weight:600;}
  .bridge{
    position:relative;height:54px;border-radius:14px;overflow:hidden;
    background:linear-gradient(90deg,#0B2F5C 0%,#0B2F5C 12%,#8FB6D9 50%,#0B2F5C 88%,#0B2F5C 100%);
  }
  .bridge-sky{position:absolute;inset:0;opacity:.9;
    background:linear-gradient(180deg, rgba(255,255,255,.12) 0%, rgba(255,255,255,0) 55%);}
  .bridge-deck{position:absolute;left:0;right:0;bottom:14px;height:3px;background:rgba(255,255,255,.55);}
  .bridge-cable{position:absolute;bottom:14px;width:1px;background:rgba(255,255,255,.4);}
  .bridge-tower{position:absolute;bottom:14px;width:3px;background:rgba(255,255,255,.55);}
  .bridge-city{position:absolute;bottom:14px;font-size:20px;}
  .bridge-city.jb{left:6px;}
  .bridge-city.sg{right:6px;}
  .bridge-track{position:absolute;bottom:16px;left:8%;right:8%;height:2px;}
  .bridge-icon{
    position:absolute;bottom:18px;font-size:22px;transform:translateX(-50%);
    transition:left .5s cubic-bezier(.4,0,.2,1);filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));
  }

  /* ---------- CARD / FORM ---------- */
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:0 2px 10px rgba(11,47,92,.05);}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--navy);margin-bottom:6px;}
  .field input, .field select{
    width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;
    font-size:16px;font-family:inherit;color:var(--ink);background:#fff;
    appearance:none;-webkit-appearance:none;
  }
  .field select{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='8' viewBox='0 0 14 8'><path d='M1 1l6 6 6-6' stroke='%235B6B7A' stroke-width='2' fill='none' fill-rule='evenodd'/></svg>");
    background-repeat:no-repeat;background-position:right 14px center;padding-right:36px;
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--green);}
  .field-hint{font-size:12px;color:var(--ink-soft);margin-top:5px;}

  .q-block{transition:opacity .22s ease, transform .22s ease;}
  .q-block.q-fade{opacity:0;transform:translateY(10px);}

  .q-scene{width:100%;height:84px;margin:0 0 16px;border-radius:16px;overflow:hidden;}
  .q-scene svg{width:100%;height:100%;display:block;}
  .q-scene-commute{background:linear-gradient(180deg,#E4F1FC,#FFFFFF);}
  .q-scene-financial{background:linear-gradient(180deg,#E7F5EF,#FFFFFF);}
  .q-scene-rights{background:linear-gradient(180deg,#FCEFDC,#FFFFFF);}
  .q-scene-profile{background:linear-gradient(180deg,#EDEFF7,#FFFFFF);}

  .pillar-tag{
    display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
    color:var(--green-dark);background:#E7F5EF;padding:5px 10px;border-radius:999px;margin-bottom:14px;
  }
  .question-subtitle{font-size:13px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--green-dark);margin-bottom:8px;}
  .question-text{font-size:21px;font-weight:800;font-family:'Montserrat','Noto Sans SC','Noto Sans Tamil',sans-serif;color:var(--navy);margin-bottom:22px;}

  /* ---------- INTRO SCREEN ---------- */
  .intro-block{margin-bottom:22px;}
  .intro-block h3{font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--green-dark);margin-bottom:8px;}
  .intro-block p{font-size:14.5px;color:var(--ink);margin:0;}
  .intro-block.disclaimer h3{color:var(--ink-soft);}
  .intro-block.disclaimer p{color:var(--ink-soft);font-size:13px;}

  .option-btn{
    display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;
    padding:16px 18px;margin-bottom:12px;border:1.5px solid var(--line);border-radius:14px;
    background:#fff;font-size:16px;font-weight:600;color:var(--ink);cursor:pointer;
    transition:border-color .15s, background .15s, transform .1s;font-family:inherit;
  }
  .option-btn:active{transform:scale(.99);}
  .option-btn:hover{border-color:#C7CCD2;box-shadow:0 2px 8px rgba(11,47,92,.07);}
  .option-btn.selected{border-color:var(--green);background:#F1FAF6;color:var(--green-dark);}
  .option-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;}
  .option-btn.selected .option-check{border-color:var(--green);background:var(--green);}

  .nav-row{display:flex;gap:10px;margin-top:auto;padding-top:22px;}
  .btn{
    flex:1;padding:15px 20px;border-radius:14px;border:none;font-size:16px;font-weight:700;
    font-family:inherit;cursor:pointer;transition:filter .15s, transform .1s;
  }
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--amber);color:var(--navy-dark);}
  .btn-primary:hover{filter:brightness(1.05);}
  .btn-primary:disabled{background:#EFE9DA;color:#A9A296;cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--line);flex:0 0 auto;padding-left:18px;padding-right:18px;}
  .btn-block{width:100%;}

  /* ---------- RESULT SCREEN ---------- */
  .result-hero{text-align:center;padding:6px 0 22px;}
  .result-hero .headline{font-size:24px;}
  .result-hero p{color:var(--ink-soft);margin-top:8px;font-size:15px;}

  .pillar-row{margin-bottom:20px;}
  .pillar-row-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:10px;}
  .pillar-row-top .name{font-weight:700;font-size:14.5px;color:var(--navy);}
  .pillar-row-top .pct{font-weight:800;font-size:14.5px;white-space:nowrap;}
  .gap-track{height:12px;border-radius:999px;background:#EDEAE1;overflow:hidden;}
  .gap-fill{height:100%;border-radius:999px;transition:width .7s ease;}
  .gap-fill.ok{background:var(--green);}
  .gap-fill.warn{background:var(--amber);}
  .gap-fill.danger{background:var(--red);}
  .pct.ok{color:var(--green-dark);}
  .pct.warn{color:#B87313;}
  .pct.danger{color:var(--red);}

  .gap-hero{
    border-radius:20px;padding:26px 22px;margin:20px 0 24px;color:#fff;
    animation:heroPop .4s cubic-bezier(.2,.8,.3,1.2) both;
  }
  @keyframes heroPop{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:scale(1);}}
  .gap-hero.ok{background:linear-gradient(160deg,var(--green-dark),#0F5C45);}
  .gap-hero.warn{background:linear-gradient(160deg,#B87313,#8A570D);}
  .gap-hero.danger{background:linear-gradient(160deg,#C4453A,#8F2A22);}
  .gap-hero-tag{
    display:inline-block;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
    background:rgba(255,255,255,.18);padding:5px 12px;border-radius:999px;margin-bottom:14px;
  }
  .gap-hero-number{
    font-family:'Montserrat','Noto Sans SC','Noto Sans Tamil','Arial Black',sans-serif;font-weight:900;font-size:64px;line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .gap-hero-fraction{font-size:14px;font-weight:600;color:rgba(255,255,255,.85);margin-top:6px;}
  .gap-hero-consequence{font-size:17px;font-weight:700;margin:16px 0 0;color:#fff;text-wrap:balance;}
  .gap-hero-message{font-size:14.5px;margin:10px 0 0;color:rgba(255,255,255,.88);}
  .pillar-breakdown-label{font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:12px;}

  .answers-review{margin-top:16px;padding:18px;background:#fff;border:1px solid var(--line);border-radius:16px;}
  .answers-review-heading{font-size:12px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--green-dark);margin-bottom:10px;}
  .answer-row{padding:10px 0;border-bottom:1px solid var(--line);}
  .answer-row:last-child{border-bottom:none;}
  .answer-row-q{font-size:13.5px;color:var(--ink);line-height:1.5;}
  .answer-row-subtitle{font-weight:700;color:var(--navy);}
  .answer-row-subtitle::after{content:' — ';}
  .answer-row-a{font-size:13px;font-weight:700;color:var(--green-dark);margin-top:4px;}

  .confirm-screen{align-items:center;text-align:center;justify-content:center;min-height:100vh;}
  .confirm-icon{font-size:52px;margin-bottom:18px;}
  .confirm-screen p{color:var(--ink-soft);max-width:34ch;margin:10px auto 0;}

  .footer-note{font-size:11px;color:#A6ADB4;text-align:center;padding:14px 0 4px;}
</style>
</head>
<body>
<div id="app" x-data="quizApp()" x-init="init()">

  <div class="demo-flag" x-text="T.demoFlag"></div>
  <div class="lang-toggle">
    <template x-for="opt in langOptions" :key="opt.code">
      <button class="lang-btn" :class="{active: lang === opt.code}" @click="lang = opt.code" x-text="opt.label"></button>
    </template>
  </div>

  <!-- ================= HOOK SCREEN ================= -->
  <template x-if="screen === 'hook'">
    <div class="screen hook-screen">
      <div>
        <div class="hook-eyebrow" x-text="T.hook.eyebrow"></div>
        <h1 class="hook-headline" x-text="T.hook.headline"></h1>
        <p class="hook-sub" x-text="T.hook.sub"></p>
      </div>
      <div class="hook-scene">
        <svg viewBox="0 0 520 220" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of the Causeway linking Johor and Singapore, with morning traffic">
          <defs>
            <radialGradient id="sunGlow" cx="50%" cy="100%" r="65%">
              <stop offset="0%" stop-color="#EF9F27" stop-opacity="0.5"/>
              <stop offset="100%" stop-color="#EF9F27" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#123B6E"/>
              <stop offset="100%" stop-color="#071F3D"/>
            </linearGradient>
          </defs>

          <rect x="0" y="0" width="520" height="220" fill="url(#sunGlow)"/>

          <rect x="0" y="168" width="520" height="52" fill="url(#waterGrad)"/>
          <rect x="0" y="169" width="520" height="2" fill="#EF9F27" opacity="0.4"/>
          <rect x="0" y="180" width="520" height="1.5" fill="#EF9F27" opacity="0.22"/>
          <rect x="0" y="193" width="520" height="1.5" fill="#EF9F27" opacity="0.15"/>

          <g fill="#0B2F5C">
            <rect x="0" y="120" width="18" height="50"/>
            <rect x="20" y="140" width="16" height="30"/>
            <rect x="38" y="110" width="20" height="60"/>
            <rect x="60" y="150" width="14" height="20"/>
            <circle cx="88" cy="150" r="13"/>
            <rect x="84" y="128" width="8" height="24"/>
            <rect x="86" y="118" width="4" height="12"/>
          </g>

          <g fill="#0B2F5C">
            <rect x="430" y="145" width="14" height="25"/>
            <rect x="446" y="120" width="18" height="50"/>
            <rect x="466" y="100" width="16" height="70"/>
            <rect x="484" y="130" width="14" height="40"/>
            <rect x="500" y="60" width="10" height="110"/>
            <rect x="503" y="50" width="4" height="12"/>
          </g>

          <path d="M60 158 Q260 148 460 158" stroke="#0B2F5C" stroke-width="10" fill="none" stroke-linecap="round"/>
          <path d="M60 158 Q260 148 460 158" stroke="#EF9F27" stroke-width="1.5" stroke-dasharray="6 6" fill="none" opacity="0.7"/>

          <g stroke="#0B2F5C" stroke-width="2">
            <line x1="110" y1="156" x2="110" y2="168"/>
            <line x1="180" y1="151" x2="180" y2="168"/>
            <line x1="260" y1="149" x2="260" y2="168"/>
            <line x1="340" y1="151" x2="340" y2="168"/>
            <line x1="410" y1="156" x2="410" y2="168"/>
          </g>

          <g>
            <rect x="90" y="150" width="10" height="6" rx="1.5" fill="#EF9F27"/>
            <rect x="105" y="149" width="8" height="5" rx="1.5" fill="#fff"/>
            <rect x="118" y="150" width="10" height="6" rx="1.5" fill="#EF9F27"/>
            <rect x="150" y="147" width="12" height="6" rx="1.5" fill="#fff"/>
            <rect x="170" y="148" width="8" height="5" rx="1.5" fill="#EF9F27"/>
            <rect x="210" y="145" width="10" height="6" rx="1.5" fill="#EF9F27"/>
            <rect x="230" y="145" width="8" height="5" rx="1.5" fill="#fff"/>
            <rect x="270" y="145" width="12" height="6" rx="1.5" fill="#fff"/>
            <rect x="300" y="146" width="8" height="5" rx="1.5" fill="#EF9F27"/>
            <rect x="330" y="148" width="10" height="6" rx="1.5" fill="#EF9F27"/>
            <rect x="360" y="150" width="8" height="5" rx="1.5" fill="#fff"/>
            <rect x="390" y="151" width="10" height="6" rx="1.5" fill="#EF9F27"/>
          </g>
        </svg>
      </div>
      <div class="hook-footer">
        <button class="btn btn-primary btn-block" @click="screen='intro'" x-text="T.hook.cta"></button>
        <p style="color:#9FB3C8;font-size:12px;text-align:center;margin-top:12px;" x-text="T.hook.caption"></p>
      </div>
    </div>
  </template>

  <!-- ================= INTRO / OBJECTIVE & DISCLAIMER ================= -->
  <template x-if="screen === 'intro'">
    <div class="screen">
      <h2 style="font-size:22px;margin-bottom:20px;" x-text="T.intro.heading"></h2>
      <div class="intro-block">
        <h3 x-text="T.intro.objectiveLabel"></h3>
        <p x-text="T.intro.objectiveText"></p>
      </div>
      <div class="intro-block disclaimer">
        <h3 x-text="T.intro.disclaimerLabel"></h3>
        <p x-text="T.intro.disclaimerText"></p>
      </div>
      <div class="nav-row">
        <button class="btn btn-ghost" @click="screen='hook'" x-text="T.backBtn"></button>
        <button class="btn btn-primary btn-block" @click="screen='info'" x-text="T.intro.continueBtn"></button>
      </div>
    </div>
  </template>

  <!-- ================= INFO CAPTURE ================= -->
  <template x-if="screen === 'info'">
    <div class="screen">
      <div class="bridge-wrap" x-html="bridgeHtml(1, totalSteps)"></div>
      <h2 style="font-size:22px;margin-bottom:6px;" x-text="T.info.heading"></h2>
      <p style="color:var(--ink-soft);font-size:14px;margin:0 0 20px;" x-text="T.info.sub"></p>
      <div class="card">
        <div class="field">
          <label x-text="T.info.labelNama"></label>
          <input type="text" x-model="info.nama" :placeholder="T.info.placeholderNama">
        </div>
        <div class="field">
          <label x-text="T.info.labelWhatsapp"></label>
          <input type="tel" x-model="info.whatsapp" placeholder="01X-XXX XXXX">
          <div class="field-hint" x-text="T.info.hintWhatsapp"></div>
        </div>
        <div class="field">
          <label x-text="T.info.labelEmel"></label>
          <input type="email" x-model="info.emel" :placeholder="T.info.placeholderEmel">
          <div class="field-hint" x-text="T.info.hintEmel"></div>
        </div>
        <div class="field">
          <label x-text="T.info.labelKawasan"></label>
          <select x-model="info.kawasan">
            <option value="" disabled selected x-text="T.info.kawasanPlaceholder"></option>
            <template x-for="opt in T.info.kawasanOptions" :key="opt.value">
              <option :value="opt.value" x-text="opt.label"></option>
            </template>
          </select>
          <div class="field-hint" x-text="T.info.hintKawasan"></div>
        </div>
      </div>
      <div class="nav-row">
        <button class="btn btn-primary btn-block" :disabled="!infoValid" @click="goToQuiz()" x-text="T.info.continueBtn"></button>
      </div>
    </div>
  </template>

  <!-- ================= SCORED QUESTIONS ================= -->
  <template x-if="screen === 'quiz'">
    <div class="screen">
      <div class="bridge-wrap" x-html="bridgeHtml(quizIndex + 2, totalSteps)"></div>
      <div class="q-block" :class="{'q-fade': transitioning}">
        <div class="q-scene" :class="'q-scene-' + currentQuestion.pillar" x-html="pillarSceneHtml(currentQuestion.pillar)"></div>
        <span class="pillar-tag" x-text="currentQuestion.pillarLabel"></span>
        <div class="question-subtitle" x-text="currentQuestion.subtitle"></div>
        <div class="question-text" x-text="currentQuestion.text"></div>
        <div>
          <template x-for="opt in T.scoreOptions" :key="opt.value">
            <button class="option-btn" :class="{selected: answers[currentQuestion.id] === opt.value}" @click="selectQuizAnswer(opt.value)">
              <span x-text="opt.label"></span>
              <span class="option-check"></span>
            </button>
          </template>
        </div>
        <div class="nav-row">
          <button class="btn btn-ghost" @click="prevQuizStep()" x-text="T.backBtn"></button>
        </div>
      </div>
    </div>
  </template>

  <!-- ================= PROFILE QUESTIONS ================= -->
  <template x-if="screen === 'profile'">
    <div class="screen">
      <div class="bridge-wrap" x-html="bridgeHtml(profileIndex + questionMeta.length + 2, totalSteps)"></div>
      <div class="q-block" :class="{'q-fade': transitioning}">
        <div class="q-scene q-scene-profile" x-html="profileSceneHtml()"></div>
        <span class="pillar-tag" style="background:#FCEFDC;color:#9A5B0E;" x-text="T.profileTag"></span>
        <div class="question-text" x-text="currentProfileQ.text"></div>
        <div>
          <template x-for="opt in currentProfileQ.options" :key="opt.value">
            <button class="option-btn" :class="{selected: profile[currentProfileQ.id] === opt.value}" @click="selectProfileAnswer(opt.value)">
              <span x-text="opt.label"></span>
              <span class="option-check"></span>
            </button>
          </template>
        </div>
        <div class="nav-row">
          <button class="btn btn-ghost" @click="prevProfileStep()" x-text="T.backBtn"></button>
        </div>
      </div>
    </div>
  </template>

  <!-- ================= RESULT SCREEN ================= -->
  <template x-if="screen === 'result'">
    <div class="screen">
      <div class="result-hero">
        <span class="hook-eyebrow" style="color:var(--green-dark);" x-text="T.result.eyebrow"></span>
        <h2 class="headline" x-text="fmt(T.result.headingSuffix, {name: info.nama || T.result.defaultName})"></h2>
      </div>

      <div class="gap-hero" :class="weakestPillar.level">

<script>
function mergeDeep(base, override){
  const result = { ...base };
  for(const key in override){
    const b = base ? base[key] : undefined;
    const o = override[key];
    const bothPlainObjects = o && typeof o === 'object' && !Array.isArray(o) && b && typeof b === 'object' && !Array.isArray(b);
    result[key] = bothPlainObjects ? mergeDeep(b, o) : o;
  }
  return result;
}

function quizApp(){
  return {
    screen: 'hook',
    ref: null,
    utm_source: null,

    lang: 'ms',
    langOptions: [
      {code:'ms', label:'BM'},
      {code:'en', label:'EN'},
      {code:'zh', label:'中文'},
      {code:'ta', label:'தமிழ்'},
    ],

    info: { nama:'', whatsapp:'', emel:'', kawasan:'' },
    quizIndex: 0,
    profileIndex: 0,
    answers: {},
    profile: {},

    questionMeta: [
      { id:'c1', pillar:'commute' }, { id:'c2', pillar:'commute' }, { id:'c3', pillar:'commute', invert:true }, { id:'c4', pillar:'commute' },
      { id:'f1', pillar:'financial' }, { id:'f2', pillar:'financial' }, { id:'f3', pillar:'financial' },
      { id:'r1', pillar:'rights' }, { id:'r2', pillar:'rights' }, { id:'r3', pillar:'rights' }, { id:'r4', pillar:'rights' },
    ],
    profileMeta: [
      { id:'tempoh', options:['<1','1-5','>5'] },
      { id:'moda', options:['motosikal','bas','kereta','jalan_rts'] },
      { id:'impian', options:['aset_rumah','pendidikan_anak','modal_perniagaan','jaminan_kebajikan'] },
      { id:'topik', options:['rawatan_perubatan','bantuan_kewangan','persaraan_simpanan','pasport_permit'] },
      { id:'hadir', options:['pagi','jauh'] },
    ],

    weakestPillarKey: 'commute',
    heroDisplayPct: 0,
    showAnswers: false,

    init(){
      const params = new URLSearchParams(window.location.search);
      this.ref = params.get('ref');
      this.utm_source = params.get('utm_source');
      this.$watch('lang', (v) => { document.documentElement.lang = v; });
    },

    get T(){ return mergeDeep(translations.ms, translations[this.lang] || {}); },

    fmt(str, vars){
      return str.replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined ? vars[k] : m));
    },

    get totalSteps(){ return 1 + this.questionMeta.length + this.profileMeta.length; },
    get infoValid(){ return this.info.nama.trim().length > 0 && this.info.whatsapp.trim().length > 0 && this.info.kawasan.trim().length > 0; },

    get currentQuestion(){
      const meta = this.questionMeta[this.quizIndex];
      const q = this.T.questions[meta.id];
      return { id: meta.id, pillar: meta.pillar, pillarLabel: this.T.pillarLabels[meta.pillar], subtitle: q.subtitle, text: q.text };
    },
    get currentProfileQ(){
      const meta = this.profileMeta[this.profileIndex];
      const tq = this.T.profileQuestions[meta.id];
      return { id: meta.id, text: tq.text, options: meta.options.map(v => ({ value: v, label: tq.options[v] })) };
    },

    get pillarResults(){
      const pillars = ['commute','financial','rights'];
      return pillars.map(key => {
        const qs = this.questionMeta.filter(q => q.pillar === key);
        let sum = 0, atRisk = 0;
        qs.forEach(q => {
          const raw = this.answers[q.id] || 0;
          const val = q.invert ? (1 - raw) : raw;
          sum += val;
          if(val > 0) atRisk++;
        });
        const pct = (sum / qs.length) * 100;
        let level = 'ok';
        if(pct >= 60) level = 'danger';
        else if(pct >= 30) level = 'warn';
        return { key, label: this.T.pillarLabels[key], pct, level, atRisk, total: qs.length };
      });
    },

    get answeredQuestions(){
      return this.questionMeta.map(meta => {
        const q = this.T.questions[meta.id];
        const val = this.answers[meta.id];
        const opt = this.T.scoreOptions.find(o => o.value === val);
        return { subtitle: q.subtitle, text: q.text, answer: opt ? opt.label : '' };
      });
    },
    get answeredProfile(){
      return this.profileMeta.map(meta => {
        const pq = this.T.profileQuestions[meta.id];
        const val = this.profile[meta.id];
        return { text: pq.text, answer: pq.options[val] || '' };
      });
    },

    get weakestPillar(){
      const key = this.weakestPillarKey;
      const stats = this.pillarResults.find(p => p.key === key) || { pct:0, atRisk:0, total:0, level:'ok', label:'' };
      const topikLabel = this.T.topikLabels[this.profile.topik];
      let message = this.T.pillarMessages[key];
      if(topikLabel){
        message += ' ' + this.fmt(this.T.result.topikTieIn, { topik: topikLabel });
      }
      return {
        key,
        label: stats.label,
        level: stats.level,
        pct: stats.pct,
        atRisk: stats.atRisk,
        total: stats.total,
        consequence: this.T.pillarConsequences[key],
        message,
      };
    },

    get ctaLabel(){
      const topic = this.T.pillarShortLabels[this.weakestPillarKey] || '';
      const tpl = this.profile.hadir === 'pagi' ? this.T.result.ctaAttend : this.T.result.ctaRemote;
      return this.fmt(tpl, { topic });
    },

    bridgeHtml(step, total){
      const pct = Math.min(100, Math.max(0, (step/total)*100));
      const leftPct = 8 + (pct/100)*84;
      const b = this.T.bridge;
      return `
        <div class="bridge-meta"><span>${b.johor}</span><span>${this.fmt(b.step, {step, total})}</span><span>${b.singapura}</span></div>
        <div class="bridge">
          <div class="bridge-sky"></div>
          <div class="bridge-city jb">🏍️🏠</div>
          <div class="bridge-city sg">🏙️🦁</div>
          <div class="bridge-deck"></div>

          <path d="M90 28 L109 37 L109 55 Q90 69 71 55 L71 37 Z" fill="none" stroke="#1D9E75" stroke-width="4"/>

          <g fill="#0B2F5C">
            <circle cx="152" cy="90" r="8"/>

            <ellipse cx="400" cy="112" rx="26" ry="7"/>

          <text x="400" y="98" font-size="11" fill="#0B2F5C" text-anchor="middle" font-weight="700" font-family="Arial, sans-serif">RM</text>

            <rect x="360" y="55" width="70" height="60" rx="8" fill="#FFFFFF" stroke="#0B2F5C" stroke-width="3"/>
            <rect x="360" y="55" width="70" height="16" rx="8" fill="#EF9F27"/>
            <text x="395" y="97" font-size="22" font-weight="800" fill="#0B2F5C" text-anchor="middle" font-family="Arial, sans-serif">18</text>
            <line x1="374" y1="48" x2="374" y2="60" stroke="#0B2F5C" stroke-width="3" stroke-linecap="round"/>
            <line x1="416" y1="48" x2="416" y2="60" stroke="#0B2F5C" stroke-width="3" stroke-linecap="round"/>
          </g>
        </svg>`;
    },

    goToQuiz(){ this.screen = 'quiz'; this.quizIndex = 0; },

    advancing: false,
    transitioning: false,

    transitionTo(fn){
      this.transitioning = true;
      setTimeout(() => {
        fn();
        this.transitioning = false;
        setTimeout(() => { this.advancing = false; }, 220);
      }, 220);
    },

    selectQuizAnswer(value){
      if(this.advancing) return;
      this.answers[this.currentQuestion.id] = value;
      this.advancing = true;
      setTimeout(() => this.transitionTo(() => this.nextQuizStep()), 300);
    },
    selectProfileAnswer(value){
      if(this.advancing) return;
      this.profile[this.currentProfileQ.id] = value;
      this.advancing = true;
      setTimeout(() => this.transitionTo(() => this.nextProfileStep()), 300);
    },

    nextQuizStep(){
      if(this.quizIndex < this.questionMeta.length - 1){
        this.quizIndex++;
      } else {
        this.screen = 'profile';
        this.profileIndex = 0;
      }
    },
    prevQuizStep(){
      if(this.advancing) return;
      this.advancing = true;
      this.transitionTo(() => {
        if(this.quizIndex > 0){ this.quizIndex--; }
        else { this.screen = 'info'; }
      });
    },

    nextProfileStep(){
      if(this.profileIndex < this.profileMeta.length - 1){
        this.profileIndex++;
      } else {
        this.finishQuiz();
      }
    },
    prevProfileStep(){
      if(this.advancing) return;
      this.advancing = true;
      this.transitionTo(() => {
        if(this.profileIndex > 0){ this.profileIndex--; }
        else { this.screen = 'quiz'; this.quizIndex = this.questionMeta.length - 1; }
      });
    },

    finishQuiz(){
      const results = this.pillarResults;
      const weakest = results.reduce((a,b) => b.pct > a.pct ? b : a, results[0]);
      this.weakestPillarKey = weakest.key;
      this.animateHeroNumber(Math.round(weakest.pct));
      this.screen = 'result';
    },

    resetQuiz(){
      this.screen = 'hook';
      this.quizIndex = 0;
      this.profileIndex = 0;
      this.answers = {};
      this.profile = {};
      this.info = { nama:'', whatsapp:'', emel:'', kawasan:'' };
      this.weakestPillarKey = 'commute';
      this.heroDisplayPct = 0;
    },

    animateHeroNumber(target){
      this.heroDisplayPct = 0;
      const duration = 700;
      const start = performance.now();
      const step = (now) => {
        const progress = Math.min(1, (now - start) / duration);
        this.heroDisplayPct = Math.round(target * (1 - Math.pow(1 - progress, 3)));
        if(progress < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    },
  };
}
</script>
